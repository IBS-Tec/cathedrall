name: cathedrall

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Consumidos pelo script de inicialização em initdb/
      CMS_DB_USER: ${CMS_DB_USER}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda UMA vez, no primeiro start com volume vazio. Alterar depois não tem efeito:
      # para reaplicar é preciso remover o volume.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposto apenas em localhost. O banco nunca atravessa o túnel (ADR-0010).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cms
      DB_USER: ${CMS_DB_USER}
      DB_PASSWORD: ${CMS_DB_PASSWORD}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

      # O Astro consome o Directus em tempo de build, do lado do servidor — não há
      # requisição de navegador, logo não há CORS a configurar. Se algum dia precisar
      # habilitar CORS aqui, é sinal de que alguém quebrou o invariante nº 3.
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    ports:
      - "127.0.0.1:8055:8055"

volumes:
  postgres-data:
  directus-uploads:
  directus-extensions:
