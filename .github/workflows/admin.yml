name: admin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filtro:
    name: filtro (admin)
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.paths.outputs.admin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/admin.yml'

  verificar:
    name: admin
    needs: filtro
    if: needs.filtro.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cathedrall/admin lint

      - name: Typecheck
        run: pnpm --filter @cathedrall/admin typecheck

      - name: Build
        run: pnpm --filter @cathedrall/admin build
