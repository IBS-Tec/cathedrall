name: api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filtro:
    name: filtro (api)
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.paths.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/api.yml'

  verificar:
    name: api
    needs: filtro
    if: needs.filtro.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json

      - name: Restaurar
        run: dotnet restore apps/api/CathedrAll.slnx

      - name: Compilar
        run: dotnet build apps/api/CathedrAll.slnx --configuration Release --no-restore

      - name: Testar
        run: dotnet test apps/api/CathedrAll.slnx --configuration Release --no-build
