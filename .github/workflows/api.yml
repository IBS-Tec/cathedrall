name: api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filtro:
    name: filtro (api)
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.paths.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/api.yml'

  verificar:
    name: api
    needs: filtro
    if: needs.filtro.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/api/global.json

      - name: Restaurar
        run: dotnet restore CathedrAll.slnx

      - name: Compilar
        run: dotnet build CathedrAll.slnx --configuration Release --no-restore

      - name: Testar
        run: dotnet test CathedrAll.slnx --configuration Release --no-build
